# Brumy — deploy with prebuilt images.
#
#   curl -O https://raw.githubusercontent.com/MarcoFabrini/brumy/main/compose.yml
#   curl -O https://raw.githubusercontent.com/MarcoFabrini/brumy/main/.env
#   # fill in .env (DOMAIN and passwords, instructions inside)
#   docker compose up -d
#
# The app listens over HTTP on 127.0.0.1:8080 (API_PORT in .env). HTTPS and
# outside access are handled by your own reverse proxy (nginx, Caddy,
# Traefik, Cloudflare Tunnel...). TRUSTED_PROXIES defaults to REMOTE_ADDR
# (trust the direct peer, i.e. your proxy): that is only safe while the port
# stays bound to 127.0.0.1 or to a private network. If you publish it on
# 0.0.0.0, anyone could forge X-Forwarded-For and dodge the per-IP rate limits:
# set TRUSTED_PROXIES to your proxy's IP/CIDR in .env instead.
#
# Attachments are capped at 20 files per record and 1 GiB per organization; raise
# or lift the size cap with ATTACHMENTS_ORG_QUOTA_MB in .env (0 = no limit).
# The number of vehicles per organization is unlimited; cap it with VEHICLES_ORG_LIMIT
# in .env (archived vehicles count too).
#
# The interactive API documentation (/api/doc, /api/doc.json) is off by default and
# needs no login when on: set API_DOC_ENABLED=true in .env to expose it.
#
# The first registered account becomes the admin and registration closes
# after that: create it before exposing the instance to the internet.
#
# Data lives in ./brumy/. Do not copy ./brumy/db while the stack is
# running (a live copy of a database directory can be inconsistent): use the
# nightly dumps in ./brumy/backups (DB + uploads) and keep .env with them.
#
# Update: take a backup first (docker compose exec -u www-data api php bin/console
# app:backup:create), then docker compose pull && docker compose up -d.
# AUTO_MIGRATE=true applies database migrations on start, so an update changes
# the schema; to stay on a known version set BRUMY_TAG to a release without
# the v (e.g. 0.1.2) instead of the default "latest".
#
# For development use Lando (lando start), not this file.

# URL pubblici derivati da DOMAIN. Stanno nell'environment del container (e non solo
# esportati dall'entrypoint nel PID 1) perché anche `docker exec` (job Ofelia come
# messenger:failed:retry) e il worker devono vederli: altrimenti i link nelle email
# ricadrebbero su http://localhost. Un valore esplicito in .env ha la precedenza.
# CORS_ALLOW_ORIGIN non è qui: serve solo al processo web e richiede un'espressione
# regolare con i punti di DOMAIN escapati, che l'interpolazione di compose non sa fare
# (la deriva l'entrypoint; un valore in .env vince comunque).
x-app-urls: &app-urls
  FRONTEND_URL: "${FRONTEND_URL:-https://${DOMAIN}}"
  DEFAULT_URI: "${DEFAULT_URI:-https://${DOMAIN}}"

# Rotazione dei log dei container: senza limiti il json-file di Docker cresce senza fine.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  api:
    image: ${BRUMY_REGISTRY:-ghcr.io/marcofabrini}/brumy-app:${BRUMY_TAG:-latest}
    environment:
      APP_ENV: prod
      AUTO_MIGRATE: "true"
      DOMAIN: "${DOMAIN:?Set DOMAIN in .env}"
      APP_SECRET: "${APP_SECRET:?Set APP_SECRET in .env (generate with: openssl rand -hex 32)}"
      JWT_PASSPHRASE: "${JWT_PASSPHRASE:?Set JWT_PASSPHRASE in .env (generate with: openssl rand -hex 32)}"
      DATABASE_URL: "mysql://${MARIADB_USER}:${MARIADB_PASSWORD:?Set MARIADB_PASSWORD in .env (generate with: openssl rand -hex 32)}@db:3306/${MARIADB_DATABASE}?serverVersion=mariadb-11.4.0&charset=utf8mb4"
      <<: *app-urls
    env_file:
      - path: .env
        required: false
    ports:
      - "127.0.0.1:${API_PORT:-8080}:80"
    volumes:
      - ./brumy/uploads:/var/storage/uploads
      - ./brumy/backups:/var/backups
      - ./brumy/jwt:/app/config/jwt
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    restart: unless-stopped
    logging: *default-logging
    labels:
      ofelia.enabled: "true"
      # I job girano come www-data (come il processo principale): da root creerebbero file in var/
      # illeggibili poi dall'app, e backup di proprietà root.
      ofelia.job-exec.reminders.user: "www-data"
      ofelia.job-exec.backup.user: "www-data"
      ofelia.job-exec.refresh-cleanup.user: "www-data"
      ofelia.job-exec.messenger-retry.user: "www-data"
      ofelia.job-exec.reminders.schedule: "0 0 7 * * *"
      ofelia.job-exec.reminders.command: "php bin/console app:reminders:dispatch --no-interaction"
      ofelia.job-exec.backup.schedule: "0 0 3 * * *"
      ofelia.job-exec.backup.command: "php bin/console app:backup:create --no-interaction"
      ofelia.job-exec.refresh-cleanup.schedule: "0 0 4 * * 0"
      ofelia.job-exec.refresh-cleanup.command: "php bin/console app:refresh-tokens:cleanup --no-interaction"
      ofelia.job-exec.messenger-retry.schedule: "0 30 * * * *"
      # messenger:failed:retry non va bene qui: senza id dei messaggi rifiuta --no-interaction e non ha --limit.
      # Consumare il transport failed fa lo stesso lavoro (un messaggio che fallisce ancora viene ritentato dalla
      # retry strategy del transport, poi scartato con l'ERROR di MessengerFailureAlertSubscriber).
      # --time-limit perché a coda vuota consume aspetta invece di uscire.
      ofelia.job-exec.messenger-retry.command: "php bin/console messenger:consume failed --limit=50 --time-limit=60 --memory-limit=128M --no-interaction"

  messenger:
    image: ${BRUMY_REGISTRY:-ghcr.io/marcofabrini}/brumy-app:${BRUMY_TAG:-latest}
    command:
      - php
      - bin/console
      - messenger:consume
      - async
      - --time-limit=3600
      - --memory-limit=128M
      - --no-interaction
    healthcheck:
      # il worker deve essere vivo: se il processo muore (exit != 0 oltre il restart) lo si vede in `docker compose ps`.
      # Il pattern [m]essenger non combacia con la riga di comando della shell che lo esegue: con
      # 'messenger:consume' pgrep trovava sé stesso e il check non poteva mai fallire.
      test: ["CMD-SHELL", "pgrep -f '[m]essenger:consume' > /dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    environment:
      APP_ENV: prod
      DOMAIN: "${DOMAIN:?Set DOMAIN in .env}"
      APP_SECRET: "${APP_SECRET:?Set APP_SECRET in .env (generate with: openssl rand -hex 32)}"
      JWT_PASSPHRASE: "${JWT_PASSPHRASE:?Set JWT_PASSPHRASE in .env (generate with: openssl rand -hex 32)}"
      DATABASE_URL: "mysql://${MARIADB_USER}:${MARIADB_PASSWORD:?Set MARIADB_PASSWORD in .env (generate with: openssl rand -hex 32)}@db:3306/${MARIADB_DATABASE}?serverVersion=mariadb-11.4.0&charset=utf8mb4"
      <<: *app-urls
    env_file:
      - path: .env
        required: false
    volumes:
      - ./brumy/uploads:/var/storage/uploads
    # Il worker parte solo quando api è healthy, cioè dopo le migrazioni (l'entrypoint le esegue
    # prima di avviare il server). La tabella messenger_messages la crea la migrazione e i
    # transport hanno auto_setup: false: se il worker la creasse per primo su un DB vuoto, il
    # CREATE TABLE della migrazione fallirebbe e api andrebbe in crash-loop.
    depends_on:
      api:
        condition: service_healthy
      db:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging

  db:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: ${MARIADB_DATABASE}
      MARIADB_USER: ${MARIADB_USER}
      MARIADB_PASSWORD: "${MARIADB_PASSWORD:?Set MARIADB_PASSWORD in .env (generate with: openssl rand -hex 32)}"
      MARIADB_RANDOM_ROOT_PASSWORD: "true"
    volumes:
      - ./brumy/db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging: *default-logging

  # Runs the scheduled jobs (reminders, backups, cleanup). It uses the Docker
  # socket: if you'd rather not give it access, remove this service and run
  # the same commands from the host's crontab with
  # docker compose exec api php bin/console <command>
  scheduler:
    image: mcuadros/ofelia:0.4.0-beta.5
    command: daemon --docker
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging

networks:
  default:
    name: brumy
