name: CI

# Solo al rilascio di una versione (tag vX.Y.Z da scripts/publish-github.sh): i push su main non
# rifanno test né immagini. workflow_dispatch permette di lanciare i test a mano e lo smoke test
# dell'immagine di produzione (job image-smoke), senza mai pubblicare.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (PHPUnit + PHPStan)
    runs-on: ubuntu-latest

    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_DATABASE: brumy
          MARIADB_ROOT_PASSWORD: ci_test_root_password
        ports: ['3306:3306']
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s --health-timeout 5s --health-retries 5

    env:
      APP_ENV: test
      APP_DEBUG: '0'
      APP_SECRET: ci_test_secret_dummy
      DATABASE_URL: mysql://root:ci_test_root_password@127.0.0.1:3306/brumy?serverVersion=mariadb-11.4.0&charset=utf8mb4
      CORS_ALLOW_ORIGIN: '^https?://localhost(:[0-9]+)?$'

    steps:
      - uses: actions/checkout@v4

      - name: Install mariadb-client (mariadb-dump)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq mariadb-client

      - name: Setup PHP 8.5
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_mysql, intl, zip, opcache, bcmath
          coverage: none
          tools: composer:v2
          ini-values: upload_max_filesize=11M, post_max_size=11M

      - name: Cache vendor
        uses: actions/cache@v4
        with:
          path: vendor
          key: vendor-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: vendor-${{ runner.os }}-

      - name: Validate composer.json
        run: composer validate --strict --no-check-publish

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Audit dependencies
        run: composer audit --locked

      - name: Create + migrate test DB
        run: |
          php bin/console doctrine:database:create --if-not-exists --no-interaction
          php bin/console doctrine:migrations:migrate --no-interaction

      - name: PHPUnit
        run: php bin/phpunit

      - name: Warm up dev container cache (for phpstan-symfony)
        env:
          APP_DEBUG: '1'
        run: php bin/console cache:warmup --env=dev

      - name: PHPStan
        run: php vendor/bin/phpstan analyse --memory-limit=512M --no-progress

  frontend:
    name: Frontend (lint + typecheck + test + build)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Test
        working-directory: frontend
        run: npm run test

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Audit dependencies (production)
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

  images:
    name: Build & push images (GHCR)
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    # tag vX.Y.Z → :X.Y.Z, :X.Y, :<sha> e :latest (latest solo per le versioni stabili, non per i
    # pre-release come v1.0.0-rc.1): BRUMY_TAG si può fissare a una versione
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Owner lowercase
        id: owner
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.owner.outputs.owner }}/brumy-app
          flavor: |
            latest=auto
          tags: |
            type=sha,format=long,prefix=
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v3

      # Smoke test PRIMA di pubblicare: l'immagine linux/amd64 si costruisce e si carica nel Docker locale
      # (load: true), poi scripts/smoke-image.sh la avvia con un MariaDB usa-e-getta e verifica SPA, API,
      # header, migrazioni, sessioni e CSRF. Se fallisce il job si ferma qui e nessun tag arriva su GHCR.
      # Il build multi-arch che segue riusa i layer di questo (stessa istanza BuildKit nel job).
      - name: Build app image for the smoke test (amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/app/Dockerfile
          target: prod
          platforms: linux/amd64
          load: true
          tags: brumy-app:smoke
          cache-from: type=gha

      - name: Smoke test
        run: scripts/smoke-image.sh brumy-app:smoke

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push app
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/app/Dockerfile
          target: prod
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Lancio a mano: stesso smoke test del job images, ma senza login né push (nessun permesso di scrittura).
  image-smoke:
    name: Smoke test dell'immagine (senza pubblicare)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build app image (amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/app/Dockerfile
          target: prod
          platforms: linux/amd64
          load: true
          tags: brumy-app:smoke
          cache-from: type=gha

      - name: Smoke test
        run: scripts/smoke-image.sh brumy-app:smoke
