# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'

    # Sessione dell'API salvata in MariaDB (PdoSessionHandler, tabella `sessions`). Il cookie vive solo finché il
    # browser resta aperto: la durata di 7 giorni la dà il remember-me (security.yaml); lato server una sessione
    # inattiva da 7 giorni viene cancellata dalla GC.
    session:
        handler_id: Symfony\Component\HttpFoundation\Session\Storage\Handler\PdoSessionHandler
        name: brumy_session
        cookie_path: /api
        cookie_httponly: true
        cookie_samesite: lax
        cookie_secure: '%app.cookie_secure%'
        cookie_lifetime: 0
        gc_maxlifetime: 604800
        gc_probability: 1
        gc_divisor: 100

    # Protezione CSRF same-origin per tutte le richieste non sicure sotto /api (App\EventListener\ApiCsrfListener):
    # Sec-Fetch-Site, oppure Origin/Referer uguali all'host della richiesta. Nessun token da mandare.
    csrf_protection:
        enabled: true
        stateless_token_ids: [api]

    http_method_override: false
    handle_all_throwables: true

    # Reverse proxy / CDN — necessario per audit log IP corretto, rate limiter per IP reale,
    # e Symfony HttpFoundation client IP detection (#3.5).
    # In dev: TRUSTED_PROXIES vuoto → comportamento standard.
    # In prod dietro Cloudflare/nginx/LB: settare TRUSTED_PROXIES con CIDR del proxy.
    #   Es. nginx locale: TRUSTED_PROXIES=127.0.0.1,REMOTE_ADDR
    #   Es. Cloudflare:   TRUSTED_PROXIES=173.245.48.0/20,103.21.244.0/22,...
    # Vedi: https://www.cloudflare.com/ips-v4/
    trusted_proxies: '%env(default::TRUSTED_PROXIES)%'
    trusted_headers: ['x-forwarded-for', 'x-forwarded-host', 'x-forwarded-proto', 'x-forwarded-port', 'x-forwarded-prefix']

    # Rate limiting (il login usa `login_throttling` del firewall, vedi security.yaml)
    rate_limiter:
        # Dedicato a forgot-password: separato dal login così uno spam non blocca l'altro.
        forgot_password:
            policy: 'fixed_window'
            limit: 3
            interval: '15 minutes'
        # Solo IP: il limite per (email, IP) non frena chi cambia indirizzo a ogni richiesta (mail bombing).
        forgot_password_ip:
            policy: 'fixed_window'
            limit: 10
            interval: '1 hour'
        api:
            policy: 'sliding_window'
            limit: 60
            interval: '1 minute'
        # Codici della verifica in due passaggi, per utente: al login (eventi Scheb, App\EventListener\TwoFactorRateLimitListener)
        # e negli endpoint che la attivano, disattivano o rigenerano i codici di recupero. Consuma solo sui fallimenti.
        two_factor:
            policy: 'fixed_window'
            limit: 5
            interval: '15 minutes'
        # register / reset-password / verify-email / inviti: i token sono a 256 bit (non indovinabili),
        # ma ogni tentativo costa hashing/DB. Per IP.
        token_actions:
            policy: 'fixed_window'
            limit: 30
            interval: '15 minutes'
        # Inviti a un'organizzazione: ognuno spedisce un'email vera dal tuo server. Per utente che invita
        # (non per IP): un account compromesso o scorretto non può usare l'istanza per fare spam.
        invite:
            policy: 'sliding_window'
            limit: 20
            interval: '1 hour'
        # Email di verifica e di conferma del cambio email, per utente: senza, il profilo spedirebbe posta a
        # indirizzi scelti dall'utente al ritmo del limite generico delle scritture (60/min).
        verification_email:
            policy: 'fixed_window'
            limit: 3
            interval: '15 minutes'

when@test:
    framework:
        test: true
        # I test girano tutti dallo stesso IP e ripetono le stesse azioni: limiti irraggiungibili.
        rate_limiter:
            api:
                limit: 100000
            token_actions:
                limit: 100000
        # Sessioni su file finti (mock_file), niente PdoSessionHandler: il suo DATABASE_URL non ha il suffisso `_test`
        # che Doctrine aggiunge al nome del database dei test.
        session:
            handler_id: null
            storage_factory_id: session.storage.factory.mock_file
