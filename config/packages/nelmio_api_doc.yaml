nelmio_api_doc:
    documentation:
        info:
            title: Brumy API
            description: |
                REST JSON API for Brumy vehicle fleet management.
                Auth: Symfony session in the HttpOnly cookie `brumy_session` (POST /api/auth/login), kept for 7 days by
                the `brumy_remember` cookie; optional two-step verification (TOTP or recovery code) at POST /api/auth/2fa/check.
                Every unsafe request (POST/PUT/PATCH/DELETE) must be same-origin: `Sec-Fetch-Site: same-origin`, or
                `Origin`/`Referer` equal to the API host (403 auth.csrf_invalid otherwise).
                Multi-tenant: every business resource is scoped to the active organization of the session
                (POST /api/auth/switch-org).
            version: 1.0.0
        # URL relativo: "Try it out" e gli esempi puntano all'origine che serve la documentazione
        servers:
            - url: /
              description: This instance
        components:
            securitySchemes:
                SessionCookie:
                    type: apiKey
                    in: cookie
                    name: brumy_session
            parameters:
                FuelPriceFuel:
                    name: fuel
                    in: query
                    required: false
                    description: 'Refueling fuel type: prices are for its base fuel (hybrid = gasoline); none for electric, hydrogen and the like'
                    schema: { type: string, enum: [gasoline, diesel, lpg, cng, electric, hybrid, hydrogen, ethanol, biodiesel] }
                # Ricerca negli elenchi (docs/03-api-endpoints.md, "Ricerca negli elenchi")
                ListSearchQ:
                    name: q
                    in: query
                    required: false
                    description: |
                        List search. Trimmed, cut to 100 characters, split on spaces; the first 6 words count. Every
                        word must match (AND) at least one field of the list (OR): text and linked names (partial,
                        case- and accent-insensitive, `%` and `_` are literal), the values sent in `hint` for that word,
                        and numbers read by the server: an integer finds amounts in [n, n+1) and exact km
                        (`125000` or `125.000`), `120,50`/`120.5` the exact amount, `2025` the year, `03/2025` the
                        month, `12/03/2025`, `1.3.25` or `2025-03-12` the day. Empty or missing = no filter.
                    schema: { type: string, maxLength: 100 }
                ListSearchHint:
                    name: hint
                    in: query
                    required: false
                    style: deepObject
                    explode: true
                    description: |
                        Translated alternatives for word `i` (0-based) of `q`, as `family:value`, e.g.
                        `hint[0][]=maintenance_type:inspection&hint[1][]=month:3`. Families: maintenance_type,
                        maintenance_category, expense_section, recurring_period, fuel_type, vehicle_type, reminder_type
                        (enum values), refueling_tank (full | partial), month (1-12). Unknown families, invalid values
                        and indexes beyond the words are ignored; at most 30 values per word. A non-array `hint` → 400.
                    schema:
                        type: object
                        additionalProperties: { type: array, items: { type: string } }
            schemas:
                FuelPricePoint:
                    type: object
                    nullable: true
                    properties:
                        price: { type: string, example: '1.789', description: 'EUR per liter' }
                        communicatedAt: { type: string, format: date, description: 'When the station communicated it' }
                FuelStationView:
                    type: object
                    properties:
                        id: { type: integer, description: 'MIMIT station id (idImpianto)' }
                        label: { type: string, example: 'Q8 · Via Emilia Est 1420, Modena' }
                        brand: { type: string }
                        address: { type: string }
                        city: { type: string }
                        province: { type: string }
                        distanceKm: { type: number, nullable: true, description: 'Only in nearby results' }
                        prices:
                            type: object
                            properties:
                                self: { $ref: '#/components/schemas/FuelPricePoint' }
                                served: { $ref: '#/components/schemas/FuelPricePoint' }
        security:
            - SessionCookie: []
    areas:
        default:
            path_patterns:
                - ^/api(?!/doc)
            disable_default_routes: true
    # Gli script della UI si servono dalla stessa origine (public/bundles/nelmioapidoc, vedi docker/app/Dockerfile):
    # la CSP di produzione ha script-src 'self', quindi né la CDN (default) né l'inline (offline) funzionano.
    # Niente scalar_config: genererebbe uno script inline di bootstrap.
    html_config:
        assets_mode: bundle

# In sviluppo il Caddyfile.dev manda ogni percorso non /api al SPA (e non c'è nessuna CSP): gli script
# di Scalar arrivano dalla CDN come prima, senza dover ricostruire il container.
when@dev:
    nelmio_api_doc:
        html_config:
            assets_mode: cdn
