nelmio_api_doc:
    documentation:
        info:
            title: Brumy API
            description: |
                REST JSON API for Brumy vehicle fleet management.
                Auth: JWT dual-channel (HttpOnly cookie web / Bearer mobile via `X-Client-Type` header).
                Multi-tenant: every business resource scoped to active `organization_id` claim.
            version: 1.0.0
        # URL relativo: "Try it out" e gli esempi puntano all'origine che serve la documentazione
        servers:
            - url: /
              description: This instance
        components:
            securitySchemes:
                Bearer:
                    type: http
                    scheme: bearer
                    bearerFormat: JWT
            parameters:
                FuelPriceFuel:
                    name: fuel
                    in: query
                    required: false
                    description: 'Refueling fuel type: prices are for its base fuel (hybrid = gasoline); none for electric, hydrogen and the like'
                    schema: { type: string, enum: [gasoline, diesel, lpg, cng, electric, hybrid, hydrogen, ethanol, biodiesel] }
            schemas:
                FuelPricePoint:
                    type: object
                    nullable: true
                    properties:
                        price: { type: string, example: '1.789', description: 'EUR per liter' }
                        communicatedAt: { type: string, format: date, description: 'When the station communicated it' }
                FuelStationView:
                    type: object
                    properties:
                        id: { type: integer, description: 'MIMIT station id (idImpianto)' }
                        label: { type: string, example: 'Q8 · Via Emilia Est 1420, Modena' }
                        brand: { type: string }
                        address: { type: string }
                        city: { type: string }
                        province: { type: string }
                        distanceKm: { type: number, nullable: true, description: 'Only in nearby results' }
                        prices:
                            type: object
                            properties:
                                self: { $ref: '#/components/schemas/FuelPricePoint' }
                                served: { $ref: '#/components/schemas/FuelPricePoint' }
        security:
            - Bearer: []
    areas:
        default:
            path_patterns:
                - ^/api(?!/doc)
            disable_default_routes: true
    # Gli script della UI si servono dalla stessa origine (public/bundles/nelmioapidoc, vedi docker/app/Dockerfile):
    # la CSP di produzione ha script-src 'self', quindi né la CDN (default) né l'inline (offline) funzionano.
    # Niente scalar_config: genererebbe uno script inline di bootstrap.
    html_config:
        assets_mode: bundle

# In sviluppo il Caddyfile.dev manda ogni percorso non /api al SPA (e non c'è nessuna CSP): gli script
# di Scalar arrivano dalla CDN come prima, senza dover ricostruire il container.
when@dev:
    nelmio_api_doc:
        html_config:
            assets_mode: cdn
