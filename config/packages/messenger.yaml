framework:
    messenger:
        failure_transport: failed

        transports:
            # Doctrine transport: riusa il DB applicativo (tabella messenger_messages),
            # niente broker esterno. async/failed condividono la tabella, separati da queue_name.
            # auto_setup: false: la tabella la crea la migrazione. Con l'auto-creazione al primo
            # uso, su un'installazione nuova il worker che parte prima delle migrazioni creava
            # la tabella e il CREATE TABLE della migrazione poi falliva (api in crash-loop).
            async:
                dsn: 'doctrine://default'
                retry_strategy:
                    max_retries: 3
                    delay: 60000
                    multiplier: 5
                options:
                    queue_name: async
                    auto_setup: false

            failed:
                dsn: 'doctrine://default'
                options:
                    queue_name: failed
                    auto_setup: false

        routing:
            # Notifiche scadenza veicolo → worker async (tabella messenger_messages)
            App\Message\SendReminderNotificationMessage: async
            # Import dei prezzi del carburante quando i dati sono vecchi (vedi FuelPrices::requestImportIfStale)
            App\Message\ImportFuelPricesMessage: async

when@test:
    framework:
        messenger:
            transports:
                async: 'in-memory://'
                failed: 'in-memory://'
