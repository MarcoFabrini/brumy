# Pattern unico per gli endpoint API pubblici, usato da access_control. Un solo punto da toccare quando si aggiunge
# un endpoint pubblico.
parameters:
    app.api_public_pattern: '^/api/(auth/(login|register|registration|logout|forgot-password|reset-password|verify-email|invitation/register|invitation/[a-f0-9]{64})|health|doc(\.json)?)$'
    # Attributo Secure dei cookie di sessione e remember-me: `auto` (segue lo schema della richiesta) in dev e test,
    # sempre Secure in produzione.
    app.cookie_secure: auto

security:
    # Argon2id per le password (default 'auto' su PHP 8.2+ usa Argon2id se disponibile)
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
            algorithm: auto

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    # Gerarchia ruoli
    role_hierarchy:
        ROLE_ORG_OWNER:  [ROLE_ORG_ADMIN, ROLE_ORG_MEMBER]
        ROLE_ORG_ADMIN:  [ROLE_ORG_MEMBER]
        ROLE_ORG_MEMBER: [ROLE_USER]

    # A ogni login (json_login, Security::login(), completamento della 2FA, ripresa da remember-me) nuovo id di
    # sessione e attributi azzerati: l'org attiva di chi usava prima lo stesso browser non passa al successivo.
    session_fixation_strategy: invalidate

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        # Tutta l'API: sessione (cookie brumy_session) + remember-me persistente, login JSON e verifica in due passaggi.
        # Nessun entry point: una richiesta non autenticata su una rotta protetta riceve 401 `http.401`.
        api:
            pattern: ^/api
            lazy: true
            provider: app_user_provider
            json_login:
                check_path: api_auth_login
                username_path: email
                password_path: password
                success_handler: App\Security\JsonAuthenticationSuccessHandler
                failure_handler: App\Security\JsonAuthenticationFailureHandler
            # 5 fallimenti al minuto per (email, IP) e 25 per IP; consuma solo sui fallimenti, blocca (429) anche con
            # la password giusta.
            login_throttling:
                max_attempts: 5
                interval: '1 minute'
            # 7 giorni dall'ultimo uso, una serie per dispositivo nella tabella rememberme_token. La firma sulla
            # password invalida ogni cookie quando la password cambia.
            remember_me:
                secret: '%kernel.secret%'
                lifetime: 604800
                always_remember_me: true
                name: brumy_remember
                path: /api
                samesite: lax
                httponly: true
                secure: '%app.cookie_secure%'
                signature_properties: [password]
                token_provider:
                    doctrine: true
            two_factor:
                check_path: api_auth_2fa_check
                auth_code_parameter_name: authCode
                prepare_on_login: true
                prepare_on_access_denied: true
                authentication_required_handler: App\Security\TwoFactorRequiredHandler
                success_handler: App\Security\JsonAuthenticationSuccessHandler
                failure_handler: App\Security\JsonAuthenticationFailureHandler
            # Risponde 204 anche senza sessione (App\EventListener\LogoutResponseListener); con invalidate_session
            # (default) la sessione sparisce e il remember-me cancella la propria serie.
            logout:
                path: api_auth_logout

    # Il codice della verifica in due passaggi si manda solo durante la verifica; il logout resta pubblico (si può
    # annullare la verifica). Tutto il resto di /api richiede un utente autenticato del tutto.
    access_control:
        - { path: ^/api/auth/2fa/check$,      roles: IS_AUTHENTICATED_2FA_IN_PROGRESS }
        - { path: '%app.api_public_pattern%', roles: PUBLIC_ACCESS }
        - { path: ^/api,                      roles: ROLE_USER }

when@prod:
    parameters:
        app.cookie_secure: true

when@test:
    security:
        password_hashers:
            # Password hash veloci nei test
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
