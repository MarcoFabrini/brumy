# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

parameters:
    app.attachments_root: '/var/storage/uploads'
    app.backups_dir: '/var/backups'
    app.frontend_url: '%env(default:app_frontend_url_default:FRONTEND_URL)%'
    app_frontend_url_default: 'http://localhost'
    app_default_uri_default: 'http://localhost'
    app_mailer_dsn_default: 'null://null'
    app.mailer_from: '%env(default:app_mailer_from_default:MAILER_FROM)%'
    app_mailer_from_default: 'noreply@brumy.local'
    # Fuso di calendario dell'istanza (scadenze dei promemoria). Override: APP_TIMEZONE.
    app.timezone: '%env(default:app_timezone_default:APP_TIMEZONE)%'
    app_timezone_default: 'Europe/Rome'
    # Tetto di spazio degli allegati per organizzazione, in MB (1 GiB). 0 = nessun limite. Override: ATTACHMENTS_ORG_QUOTA_MB.
    app_attachments_org_quota_mb_default: 1024
    # Tetto di veicoli per organizzazione (archiviati inclusi). 0 = nessun limite. Override: VEHICLES_ORG_LIMIT.
    app_vehicles_org_limit_default: 0
    # Prezzi del carburante dall'open data MIMIT (solo Italia). Override: FUEL_PRICES_ENABLED=0 per spegnerli.
    app_fuel_prices_enabled_default: true

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Enum/'
            - '../src/Kernel.php'
            - '../src/Dto/'

    App\Service\Storage\AttachmentStorageInterface: '@App\Service\Storage\LocalAttachmentStorage'

    _instanceof:
        App\Service\Push\PushNotifierInterface:
            tags: ['app.push_notifier']

    App\Service\AppClock:
        arguments:
            $timezone: '%app.timezone%'

    # Sessioni in MariaDB (ricetta "Store Sessions in a Database" della documentazione Symfony): stessa connessione
    # di Doctrine, tabella `sessions` creata dalla migrazione.
    Symfony\Component\HttpFoundation\Session\Storage\Handler\PdoSessionHandler:
        arguments:
            - '%env(DATABASE_URL)%'

when@test:
    services:
        # Lo storage di sessione dei test (mock_file) usa lo stesso nome di cookie dell'app, così i test leggono e
        # mandano `brumy_session` come il browser.
        session.storage.factory.mock_file:
            class: Symfony\Component\HttpFoundation\Session\Storage\MockFileSessionStorageFactory
            arguments: ['%kernel.cache_dir%/sessions', 'brumy_session']

    parameters:
        app.attachments_root: '%kernel.project_dir%/var/test-storage/uploads'
        app.backups_dir: '%kernel.project_dir%/var/test-storage/backups'
        # 1 MB: i test del limite lavorano al byte senza dover creare file enormi.
        app_attachments_org_quota_mb_default: 1
        # 3 veicoli: i test del tetto lavorano al confine senza crearne decine (i factory non passano dal controllo).
        app_vehicles_org_limit_default: 3
