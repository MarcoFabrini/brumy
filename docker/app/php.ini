memory_limit = 256M
upload_max_filesize = 11M
; > upload_max_filesize: il body multipart include anche i campi del form
post_max_size = 13M
max_execution_time = 30
date.timezone = UTC
expose_php = Off
; Nessun errore PHP a video (anche prima che il runtime di Symfony parta, o da CLI): vanno nel log
display_errors = Off
html_errors = Off
log_errors = On
; Le sessioni le gestisce Symfony e non usano l'upload progress: spento, e senza di lui cadono i percorsi
; d'attacco noti di CVE-2026-109619. Difesa in profondità: la correzione vera è PHP >= 8.5.12.
session.upload_progress.enabled = Off
